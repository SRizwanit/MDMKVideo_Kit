name: Transcribe mdmk to timestamp.json

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Whisper model (tiny, base, small, medium, large-v3)"
        default: "large-v3"
        required: true
  push:
    paths:
      - "mdmk.mp3"
      - "mdmk.mp4"

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      WHISPER_MODEL: ${{ github.event.inputs.model || 'large-v3' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install faster-whisper

      - name: Transcribe (mixed language, word-level timestamps)
        run: |
          cat > transcribe.py << 'PY'
          import os, json
          from faster_whisper import WhisperModel

          src = None
          for name in ("mdmk.mp3", "mdmk.mp4"):
              if os.path.exists(name):
                  src = name
                  break
          if src is None:
              raise SystemExit("mdmk.mp3 / mdmk.mp4 repo root-e paoa jayni")

          print("Input:", src, "| Model:", os.environ["WHISPER_MODEL"])
          model = WhisperModel(os.environ["WHISPER_MODEL"], device="cpu", compute_type="int8")

          # language=None + multilingual=True => Bangla/English mix auto-detect (per segment)
          segments, info = model.transcribe(
              src,
              language=None,
              multilingual=True,
              word_timestamps=True,
              beam_size=5,
              vad_filter=True,
          )

          out_segments, out_words, full_text = [], [], []
          for seg in segments:
              words = []
              for w in (seg.words or []):
                  item = {
                      "word": w.word.strip(),
                      "start_ms": int(round(w.start * 1000)),
                      "end_ms": int(round(w.end * 1000)),
                      "probability": round(w.probability, 4),
                  }
                  words.append(item)
                  out_words.append(item)
              out_segments.append({
                  "id": seg.id,
                  "start_ms": int(round(seg.start * 1000)),
                  "end_ms": int(round(seg.end * 1000)),
                  "text": seg.text.strip(),
                  "words": words,
              })
              full_text.append(seg.text.strip())
              print(f"[{seg.start:.2f} -> {seg.end:.2f}] {seg.text.strip()}")

          result = {
              "source_file": src,
              "model": os.environ["WHISPER_MODEL"],
              "detected_language": info.language,
              "duration_ms": int(round(info.duration * 1000)),
              "text": " ".join(full_text),
              "segments": out_segments,
              "words": out_words,
          }

          with open("timestamp.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          print("timestamp.json written:", len(out_words), "words")
          PY
          python transcribe.py
          rm -f transcribe.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: timestamp-json
          path: timestamp.json

      - name: Commit timestamp.json to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add timestamp.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add timestamp.json [skip ci]"
            git push
          fi
